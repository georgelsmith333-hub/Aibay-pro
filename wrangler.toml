name = "aibay-pro-george-live"
compatibility_date = "2026-08-08"
pages_build_output_dir = "dist"

[vars]
APP_ENV = "production"
DEFAULT_MARKETPLACE = "EBAY_US"
PUBLIC_API_VERSION = "v1"
USE_JINA_READER = "1"  # documented public reader fallback when the edge IP is blocked

[[d1_databases]]
binding = "DB"
database_name = "aibay-george-db"
database_id = "3267a266-8716-45dc-9e61-13bf8e285962"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "d16729d9dea5429f92a0c27f05c25757"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "aibay-george-media"

[[queues.producers]]
binding = "JOB_QUEUE"
queue = "aibay-george-research"
