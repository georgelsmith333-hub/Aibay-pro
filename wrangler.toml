name = "aibay"
compatibility_date = "2026-08-08"
pages_build_output_dir = "dist"

[vars]
APP_ENV = "production"
DEFAULT_MARKETPLACE = "EBAY_US"
PUBLIC_API_VERSION = "v1"

# Secrets (configure via `wrangler pages secret put` / GitHub Actions; never commit):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BROWSER_RUN_CANARY
#   EBAY_CLIENT_ID, EBAY_CLIENT_SECRET
#   AI_ROUTES (JSON), AI_PROVIDER_API_KEY / _BASE_URL / _MODEL (legacy)
#
# Durable bindings are materialized by scripts/ensure-infra.mjs during
# deployment (D1 "aibay-db", KV "aibay-cache", R2 "aibay-media",
# Queue "aibay-jobs") and appended below as "# --- generated bindings ---".
# Local dev runs without bindings: every feature falls back to request-only
# behavior and reports it truthfully.
